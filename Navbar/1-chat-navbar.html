<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Navbar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; background: #0b141a; }

    .chat-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #202c33;
      color: #e9edef;
      padding: 12px 16px;
      height: 64px;
    }

    .left { display: flex; align-items: center; gap: 14px; min-width: 0; }

    .avatar {
      width: 42px; height: 42px; flex-shrink: 0;
      border-radius: 50%;
      background: #3b1f2b;
      display: flex; align-items: center; justify-content: center;
    }
    .avatar svg { fill: #e0566b; width: 22px; height: 22px; }

    .info { min-width: 0; }
    .info h1 { font-size: 1rem; font-weight: 600; }
    .info p {
      font-size: 0.8rem; color: #8696a0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 520px;
    }

    .right { display: flex; align-items: center; gap: 14px; }

    .pill {
      display: flex; align-items: center; gap: 8px;
      border: 1px solid #3b4a54;
      background: transparent;
      color: #e9edef;
      border-radius: 22px;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .pill:hover, .icon-btn:hover { background: #2a3942; }

    .icon-btn {
      background: transparent; border: none; cursor: pointer;
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    svg { fill: #aebac1; width: 22px; height: 22px; }
    .pill svg { width: 20px; height: 20px; }
    .divider { width: 1px; height: 28px; background: #3b4a54; }

    @media (max-width: 700px) {
      .info p { max-width: 160px; }
      .pill span { display: none; }
    }
  </style>
</head>
<body>

  <header class="chat-bar">
    <div class="left">
      <div class="avatar">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      </div>
      <div class="info">
        <h1>Batch-101 Web Dev Group</h1>
        <p>You, Aarav, Diya, Kabir, Meera, Rohan, Sana, Tanvi, Vivaan, Yash, Zoya, Neel, Isha</p>
      </div>
    </div>

    <div class="right">
      <button class="pill">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        <span>Add to list</span>
        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </button>

      <button class="pill">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </button>

      <div class="divider"></div>

      <button class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
      <button class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </button>
    </div>
  </header>

</body>
</html>

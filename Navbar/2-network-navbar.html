<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Navbar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f3f2ef; }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 0 40px;
      height: 56px;
    }

    .left { display: flex; align-items: center; gap: 10px; }

    .logo {
      width: 34px; height: 34px;
      background: #0a7a5a;
      color: #fff;
      border-radius: 4px;
      font-weight: bold;
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
    }

    .search {
      display: flex; align-items: center; gap: 8px;
      background: #eef3f8;
      border-radius: 20px;
      padding: 8px 14px;
      width: 280px;
    }
    .search input {
      border: none; background: transparent; outline: none;
      font-size: 0.9rem; width: 100%;
    }
    .search svg { width: 18px; height: 18px; fill: #444; }

    .menu { display: flex; align-items: stretch; height: 100%; }

    .item {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px;
      width: 80px;
      color: #666;
      font-size: 0.72rem;
      text-decoration: none;
      border-bottom: 2px solid transparent;
    }
    .item:hover { color: #000; }
    .item.active { color: #000; border-bottom-color: #000; }
    .item svg { width: 24px; height: 24px; fill: currentColor; }

    .badge {
      position: absolute;
      top: 6px; left: 46px;
      background: #cc1016;
      color: #fff;
      font-size: 0.65rem;
      min-width: 17px; height: 17px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px;
    }

    .me-pic {
      width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(135deg, #f4a93d, #c2410c);
    }

    .divider { width: 1px; background: #e0e0e0; margin: 8px 6px; }

    .premium { width: 120px; font-size: 0.72rem; text-align: center; }
    .premium .gem {
      width: 20px; height: 20px; border-radius: 3px;
      background: linear-gradient(135deg, #e8a23b, #b9741a);
    }

    @media (max-width: 1000px) {
      .search { width: 160px; }
      .item { width: 64px; }
      .nav { padding: 0 12px; }
      .premium, .divider { display: none; }
    }
  </style>
</head>
<body>

  <header class="nav">
    <div class="left">
      <div class="logo">Lu</div>
      <div class="search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" placeholder="Search">
      </div>
    </div>

    <nav class="menu">
      <a href="#" class="item active">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Home
      </a>
      <a href="#" class="item">
        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        My Network
        <span class="badge">5</span>
      </a>
      <a href="#" class="item">
        <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
        Jobs
      </a>
      <a href="#" class="item">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        Messaging
      </a>
      <a href="#" class="item">
        <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        Notifications
        <span class="badge">25</span>
      </a>
      <a href="#" class="item">
        <div class="me-pic"></div>
        Me &#9662;
      </a>

      <div class="divider"></div>

      <a href="#" class="item">
        <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
        For Business &#9662;
      </a>
      <a href="#" class="item premium">
        <div class="gem"></div>
        Try Plus for &#8377;0
      </a>
    </nav>
  </header>

</body>
</html>

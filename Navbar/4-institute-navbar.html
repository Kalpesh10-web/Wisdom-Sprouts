<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Institute Navbar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; background: #fff; }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #d4e8e6;
      padding: 14px 50px;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand svg { width: 38px; height: 38px; }
    .brand-text { line-height: 1.1; }
    .brand-text strong {
      display: block;
      font-size: 1.05rem;
      letter-spacing: 2px;
      color: #1f5f5b;
    }
    .brand-text small { font-size: 0.65rem; color: #1f5f5b; font-style: italic; }

    .links a {
      color: #1f2937;
      text-decoration: none;
      font-size: 0.9rem;
      margin: 0 14px;
    }
    .links a:hover,
    .links a.active { color: #f26a21; }

    .contact {
      background: #f26a21;
      color: #fff;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 25px;
      font-size: 0.9rem;
    }
    .contact:hover { background: #d9560f; }

    @media (max-width: 1000px) {
      .nav { flex-direction: column; gap: 14px; padding: 14px 16px; }
      .links { text-align: center; }
      .links a { display: inline-block; margin: 4px 8px; }
    }
  </style>
</head>
<body>

  <header class="nav">
    <a href="#" class="brand" style="text-decoration:none;">
      <!-- Original leaf logo -->
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M32 58V30" stroke="#1f5f5b" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M32 32C14 32 10 18 12 8c14 0 22 8 20 24z" fill="#2e9e8f"/>
        <path d="M32 38C46 38 54 28 54 18c-12 0-24 6-22 20z" fill="#7cc576"/>
      </svg>
      <div class="brand-text">
        <strong>GREEN SHOOTS</strong>
        <small>IT Training Hub</small>
      </div>
    </a>

    <nav class="links">
      <a href="#" class="active">Home</a>
      <a href="#">About Us</a>
      <a href="#">Courses</a>
      <a href="#">Blogs</a>
      <a href="#">Placements</a>
      <a href="#">Internship</a>
      <a href="#">Gallery</a>
      <a href="#">Hire From Us</a>
    </nav>

    <a href="#" class="contact">Contact Us</a>
  </header>

</body>
</html>
